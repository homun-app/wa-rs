[package]
name = "wa-rs-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local HTTP sidecar bridging wa-rs to the Homun engine channel gateway"

[dependencies]
wa-rs = { path = ".." }
wa-rs-core = { path = "../wacore" }
wa-rs-proto = { path = "../waproto" }
wa-rs-sqlite-storage = { path = "../storages/sqlite-storage" }
wa-rs-tokio-transport = { path = "../transports/tokio-transport" }
wa-rs-ureq-http = { path = "../http_clients/ureq-client" }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.48", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
ureq = { version = "3", default-features = false, features = ["json"] }
env_logger = "0.11"

[[bin]]
name = "wa-rs-bridge"
path = "src/main.rs"
